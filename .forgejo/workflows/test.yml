# Runs on git.borodutch.com's Forgejo runner. GitHub ignores .forgejo/, and Forgejo ignores .github/workflows.
name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    # act image + Rust and Node preinstalled: no rustup download or toolchain cache per run
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-24.04
      # Build output and crates live in RAM: the runner's disk is the bottleneck, and a big container layer
      # also makes the runner's cleanup after the job slow.
      options: --tmpfs /ramdisk:exec
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_HOME: /ramdisk/cargo
      CARGO_TARGET_DIR: /ramdisk/target
      PLAIN_HOME: /ramdisk/plain
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> ../../../ramdisk/target # = CARGO_TARGET_DIR, relative to /workspace/<owner>/<repo>
          cache-directories: /ramdisk/plain/solc
          save-if: true # TEMP: measure warm runs on the PR
      - run: |
          rustc --version; node --version
          # the TS fixture test imports viem; install it while the tests compile
          npm install --prefix tests/fixture --no-package-lock --no-audit --no-fund > npm.log 2>&1 &
          npm=$!
          cargo test --locked --no-run
          wait $npm || { cat npm.log; exit 1; }
          cargo test --locked
