[package]
name = "plain"
version = "0.1.0"
edition = "2024"
description = "Compile, test and deploy EVM smart contracts. One binary, zero setup."
license = "MIT"

[dependencies]
alloy-consensus = { version = "2.5.0", features = ["k256"] }
alloy-dyn-abi = "1.7.3"
alloy-eips = "2.5"
alloy-json-abi = "1.7.3"
alloy-primitives = { version = "1.7.3", features = ["k256"] }
alloy-sol-types = "1.7.3"
hex = "0.4.3"
k256 = "0.13"
rayon = "1.12.0"
revm = { version = "43", default-features = false, features = ["std", "optional_block_gas_limit", "optional_no_base_fee", "optional_eip3607", "optional_balance_check", "secp256k1"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
