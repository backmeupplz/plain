[package]
name = "plain-evm" # "plain" on crates.io is an unrelated crate; the binary is still `plain`
version = "0.4.0"
edition = "2024"
description = "Compile, test and deploy EVM smart contracts with a single binary that needs no setup"
license = "MIT"
repository = "https://github.com/backmeupplz/plain"
homepage = "https://getplain.org"
readme = "README.md"
keywords = ["ethereum", "evm", "solidity", "foundry", "smart-contracts"]
categories = ["command-line-utilities", "development-tools::testing", "cryptography::cryptocurrencies"]
include = ["/src", "/std", "/LICENSE", "/README.md"]

[[bin]]
name = "plain"
path = "src/main.rs"

# cargo binstall plain-evm: downloads the release tarball instead of compiling
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/plain-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
aes = "0.8"
alloy-consensus = { version = "2.5.0", features = ["k256"] }
alloy-dyn-abi = "1.7.3"
alloy-eips = "2.5"
alloy-json-abi = "1.7.3"
alloy-primitives = { version = "1.7.3", features = ["k256"] }
alloy-sol-types = "1.7.3"
ctr = "0.9"
getrandom = "0.3"
hex = "0.4.3"
k256 = "0.13"
libc = "0.2"
rayon = "1.12.0"
revm = { version = "43", default-features = false, features = ["std", "optional_block_gas_limit", "optional_no_base_fee", "optional_eip3607", "optional_balance_check", "secp256k1"] }
scrypt = { version = "0.11", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] } # JSON cheatcodes keep key order, as in forge
sha2 = "0.11.1"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
