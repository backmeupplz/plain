# npm and crates.io accept trusted publishing only from GitHub-hosted CI (not Forgejo), so these two publish steps run
# here, on the GitHub mirror, when .forgejo/workflows/release.yml on git.borodutch.com publishes the GitHub Release with
# the binaries. No tokens: both registries trust this file by name (backmeupplz/plain, .github/workflows/release.yml),
# and npm adds provenance. Forgejo ignores this directory (.forgejo/ exists); attest.yml runs on the same event.
name: release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  npm:
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing, which also adds provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # its npm (11.5.1+) publishes with trusted publishing
      - name: Publish, platform packages first so plain-evm's optional dependencies resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" -p 'plain-*.tar.gz' -D dist
          packaging/npm/build.sh "$v" dist npm
          for dir in npm/plain-evm-* npm/plain-evm; do
            npm view "$(basename "$dir")@$v" version > /dev/null 2>&1 || npm publish "./$dir" --access public
          done

  crates:
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
