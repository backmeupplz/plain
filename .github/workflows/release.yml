# Pushing a v* tag builds plain for each platform the installer (docs/install) supports, then publishes them in one
# go with SHA256SUMS, which the installer checks. Actions are pinned to commits: a moved tag can't change a release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          # glibc 2.34+; solc has no official linux-arm64 builds before 0.8.31, so plain has none yet
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf plain-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plain-${{ matrix.target }}
          path: plain-${{ matrix.target }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plain-*
          merge-multiple: true
      - run: sha256sum plain-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            plain-*.tar.gz
            SHA256SUMS
