# Releases are built on git.borodutch.com (.forgejo/workflows/release.yml), which has no GitHub OIDC, so this runs on
# GitHub when that job publishes the GitHub Release (or the release is edited) and adds a build provenance attestation
# for each file listed in its SHA256SUMS, which `gh attestation verify <file> -R backmeupplz/plain` and mise check.
# It never writes to the release, so it can't trigger itself, and it skips files that are attested already, so a
# published + edited pair or a later edit doesn't attest twice. Forgejo ignores this directory (.forgejo/ exists).
name: attest
on:
  release:
    types: [published, edited]
permissions:
  contents: read
concurrency: attest-${{ github.event.release.tag_name }} # queued, not cancelled: the second run sees the first's work
jobs:
  attest:
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # this and the two below: build provenance
      attestations: write
      artifact-metadata: write
    steps:
      - name: The files in SHA256SUMS that have no attestation yet
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS || { echo "$TAG has no SHA256SUMS"; exit 0; }
          while read -r sum file; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$sum" --jq '.attestations | length' 2> /dev/null) || n=0
            [ "$n" -gt 0 ] || printf '%s  %s\n' "$sum" "$file"
          done < SHA256SUMS > todo
          cat todo
          if [ -s todo ]; then echo any=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.todo.outputs.any
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: todo
