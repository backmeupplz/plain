<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="https://getplain.org{{ page.url }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="plain">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="https://getplain.org{{ page.url }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:image" content="https://getplain.org{{ page.og_image | default: '/og.png' }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% capture og_alt %}{{ page.og_image_alt | default: "plain: Solidity in seconds, not minutes." }}{% endcapture %}
<meta property="og:image:alt" content="{{ og_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@backmeupplz">
<meta name="twitter:creator" content="@backmeupplz">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="https://getplain.org{{ page.og_image | default: '/og.png' }}">
<meta name="twitter:image:alt" content="{{ og_alt }}">
<style>
:root {
  --bg: #fbfbf8; --fg: #1b1b19; --muted: #66665f; --line: #e4e3dc; --card: #f3f2ec;
  --code: #efeee7; --accent: #1f7a4d; --str: #9a5b13; --num: #2f5fa7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --fg: #ecebe5; --muted: #9a9991; --line: #282825; --card: #191917;
    --code: #1b1b19; --accent: #4cc38a; --str: #e0b36b; --num: #8fb4ff; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16.5px/1.65 var(--sans); }
a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; border-bottom: 1px solid var(--line); }
.mark { font: 700 22px var(--mono); letter-spacing: -0.5px; text-decoration: none; }
.mark span { color: var(--accent); }
nav a { margin-left: 22px; font-size: 15px; color: var(--muted); text-decoration: none; }
nav a:hover, nav a.on { color: var(--fg); }
.doc { display: grid; grid-template-columns: 220px minmax(0, 1fr); column-gap: 56px; padding: 40px 0 72px; }
.doc > * { grid-column: 2; max-width: 760px; }
#markdown-toc { grid-column: 1; grid-row: 1 / span 999; align-self: start; position: sticky; top: 24px;
  list-style: none; margin: 0; padding: 0; font-size: 14.5px; border-left: 1px solid var(--line); }
#markdown-toc li { margin: 0; }
#markdown-toc a { display: block; padding: 4px 0 4px 14px; color: var(--muted); text-decoration: none; }
#markdown-toc a:hover { color: var(--fg); }
h1 { font-size: clamp(32px, 5vw, 42px); line-height: 1.1; letter-spacing: -1px; margin: 0 0 14px; }
h2 { font-size: 26px; letter-spacing: -0.5px; line-height: 1.2; margin: 52px 0 12px; padding-top: 8px; }
h3 { font-size: 18.5px; margin: 30px 0 8px; }
p, ul, ol, table, pre, .highlighter-rouge { margin: 0 0 16px; }
li { margin: 4px 0; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
:not(pre) > code { overflow-wrap: anywhere; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.6; }
pre code { background: none; border: 0; padding: 0; font-size: 13.5px; }
.highlighter-rouge pre.highlight { margin: 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 650; }
blockquote { margin: 0 0 16px; padding: 10px 16px; background: var(--card); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; color: var(--muted); }
blockquote p { margin: 0; }
.lead { font-size: 19px; color: var(--muted); }
/* rouge tokens */
.highlight .c, .highlight .c1, .highlight .cm, .highlight .cs, .highlight .cp { color: var(--muted); font-style: italic; }
.highlight .k, .highlight .kd, .highlight .kn, .highlight .kr, .highlight .kt, .highlight .kc, .highlight .ow { color: var(--accent); font-weight: 600; }
.highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .se, .highlight .sh, .highlight .si { color: var(--str); }
.highlight .m, .highlight .mi, .highlight .mf, .highlight .mh, .highlight .il { color: var(--num); }
.highlight .nf, .highlight .nc, .highlight .nb { font-weight: 600; }
footer { border-top: 1px solid var(--line); padding: 30px 0 48px; color: var(--muted); font-size: 15px; }
@media (max-width: 860px) {
  .doc { display: block; padding-top: 28px; }
  #markdown-toc { position: static; columns: 2; border-left: 0; background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  #markdown-toc a { padding: 3px 0; }
  nav a { margin-left: 14px; }
}
</style>
<script defer src="https://lumen.borodutch.com/l.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">plain<span>.</span></a>
    <nav><a href="/#speed">Benchmarks</a><a class="on" href="/docs/">Docs</a><a href="https://github.com/backmeupplz/plain">GitHub</a></nav>
  </header>
  <main class="doc">
{{ content }}
  </main>
  <footer>plain is MIT licensed. Something missing or wrong here? <a href="https://github.com/backmeupplz/plain/blob/main/docs/docs/index.md">Edit this page</a> or <a href="https://github.com/backmeupplz/plain/issues">open an issue</a>.</footer>
</div>
</body>
</html>
